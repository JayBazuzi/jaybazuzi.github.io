# Lychee configuration for this Jekyll site.

# Some sites (Stack Overflow, Substack) answer link checkers with 403/429.
accept = [200, 204, 403, 429]

exclude = [
  # Unrendered Liquid, e.g. {{ site.baseurl }}/images/404.jpg
  '%7B%7B',
  # Site routes that Jekyll creates from permalinks, not files in the repo
  'file://.*/(about|Safeguarding)$',
  # The anchor is generated by script, so lychee cannot find it
  'learn\.microsoft\.com/.*#122032-query-expressions-with-continuations',
]
